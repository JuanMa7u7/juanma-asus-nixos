# format = '[[ $symbol ($version) ](fg:#769ff0 bg:#1d2230)]($style)'

[nix_shell]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol ($name) ](fg:#769ff0 bg:#1d2230)]($style)'

[package]
symbol = "󰏖"
style = "bg:#0d0f14"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#0d0f14)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#0d0f14"
format = '[[  $time ](fg:#a0a9cb bg:#0d0f14)]($style)'
