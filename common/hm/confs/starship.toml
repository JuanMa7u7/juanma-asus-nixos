"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
[ 🗿 ](bg:#a3aed2 fg:#090c0c)\
[▓](bg:#c8c8c8 fg:#a3aed2)\
$directory\
[▓](bg:#909090 fg:#c8c8c8)\
$git_branch\
$git_status\
[▓](bg:#606060 fg:#909090)\
$nodejs\
$rust\
$golang\
$bun\
$python\
$php\
$flutter\
$just\
[▓](fg:#606060 bg:#404040)\
$docker\
$kubectl\
$nix_shell\
$package\
[▓](fg:#404040 bg:#252525)\
$time\
[▓ ](fg:#252525)\
\n$character"""

[directory]
style = "fg:#1a1a1a bg:#c8c8c8"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#909090"
format = '[[ $symbol $branch ](fg:#1a1a1a bg:#909090)]($style)'

[git_status]
style = "bg:#909090"
format = '[[($all_status$ahead_behind )](fg:#1a1a1a bg:#909090)]($style)'

[nodejs]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

[rust]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

[golang]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

[bun]
symbol = "󰀓"
style = "bg:#606060"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

[python]
symbol = "󰌠"
style = "bg:#606060"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

[php]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

# [flutter]
# symbol = "󰌘"
# style = "bg:#606060"
# format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#606060)]($style)'

# [just]
