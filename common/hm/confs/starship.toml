# [kubectl]
# symbol = "󰠱"
# style = "bg:#404040"
# format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#404040)]($style)'

[nix_shell]
symbol = ""
style = "bg:#404040"
format = '[[ $symbol ($name) ](fg:#c8c8c8 bg:#404040)]($style)'

[package]
symbol = "󰏖"
style = "bg:#252525"
format = '[[ $symbol ($version) ](fg:#c8c8c8 bg:#252525)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#252525"
format = '[[  $time ](fg:#c8c8c8 bg:#252525)]($style)'
